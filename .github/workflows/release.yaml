# On a v* tag: check it matches the version in the code, run the tests, push the image to
# ghcr.io/<owner>/hindsight-gateway (amd64 + arm64), and create a GitHub Release with that
# version's CHANGELOG section.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the version
        id: version
        run: |
          v=$(python3 -c 'import re;print(re.search(r"__version__ = \"([^\"]+)\"", open("hindsight_gateway/__init__.py").read()).group(1))')
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but hindsight_gateway/__init__.py says $v"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Tests
        run: PYTHONPATH=. python3 -m unittest discover -s tests -t tests

      - name: Release notes from CHANGELOG.md
        run: |
          v=${{ steps.version.outputs.version }}
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {on=1; next} /^## \[/ {on=0} /^\[[^]]+\]: / {on=0} on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then echo "::error::CHANGELOG.md has no section for [$v]"; exit 1; fi
          {
            echo
            echo "Image: \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hindsight-gateway:${v}\`"
          } >> notes.md

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hindsight-gateway" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=MIT

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "hindsight-gateway ${{ steps.version.outputs.version }}" --notes-file notes.md
